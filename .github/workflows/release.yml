name: release

on: # Triggered by completed runs of the test workflow on the main branch
  workflow_run:
    workflows:
      - 'test'
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' # only on success
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:sourcemaps --if-present
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CF_PAGES_COMMIT_SHA: ${{ github.event.after }}
          CF_PAGES_BRANCH: ${{ github.event.ref }}
      - name: Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: ./out/_next/static/chunks/*.js.map
